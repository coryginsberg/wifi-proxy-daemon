name: Release package

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-package
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Read version
        id: version
        run: printf 'version=%s\n' "$(tr -d '[:space:]' < VERSION)" >> "$GITHUB_OUTPUT"

      - name: Check for an existing release
        id: existing
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            printf 'exists=true\n' >> "$GITHUB_OUTPUT"
            printf '::notice::Release v%s already exists, skipping build.\n' "$VERSION"
          else
            printf 'exists=false\n' >> "$GITHUB_OUTPUT"
          fi

      - name: Build package
        if: steps.existing.outputs.exists == 'false'
        run: ./build-pkg.sh

      - name: Publish release
        if: steps.existing.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh release create "v$VERSION" \
            "dist/WiFiProxyDaemon-$VERSION.pkg" \
            --title "v$VERSION" \
            --generate-notes \
            --latest
